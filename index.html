<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LumaireBalloon 嶼光製氣</title>
  
  <!-- 引入 Google Fonts 文青質感書法字體 (Ma Shan Zheng) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">

  <style>
    /* 頁面基礎設定 */
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, "Helvetica Neue", sans-serif;
      background-color: #faf7f2;
    }

    /* 頂部 Header 區域 */
    .header-container {
      position: relative;
      background-color: #f2efe9;
      padding: 20px;
      text-align: center;
    }

    /* 漢堡按鈕圖示（固定在 Header 左上角） */
    .hamburger-menu {
      position: absolute;
      top: 25px;
      left: 25px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 26px;
      height: 18px;
      cursor: pointer;
      z-index: 1000;
    }

    .hamburger-menu .bar {
      height: 2px;
      width: 100%;
      background-color: #8c7361;
      border-radius: 2px;
      transition: all 0.3s ease;
    }

    /* 側邊抽屜選單 */
    .sidebar {
      position: fixed;
      top: 0;
      left: -260px;
      width: 250px;
      height: 100%;
      background-color: #faf7f2;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
      transition: left 0.3s ease;
      z-index: 1001;
      padding-top: 60px;
    }

    .sidebar.active {
      left: 0;
    }

    /* 關閉按鈕 (X) */
    .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 28px;
      color: #8c7361;
      cursor: pointer;
    }

    /* 選單連結樣式 */
    .sidebar ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .sidebar ul li {
      padding: 15px 30px;
    }

    .sidebar ul li a {
      text-decoration: none;
      color: #5c4d42;
      font-size: 16px;
      display: block;
      transition: color 0.2s;
    }

    .sidebar ul li a:hover {
      color: #a88b74;
    }

    /* 背景半透明遮罩 */
    .overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.3);
      z-index: 999;
    }

    .overlay.active {
      display: block;
    }

    /* 標題區域 */
    .title-area h1 {
      margin: 0;
      font-size: 24px;
      color: #8c7361;
      font-weight: normal;
    }

    .title-area p {
      margin: 5px 0 15px 0;
      font-size: 12px;
      color: #a88b74;
      letter-spacing: 2px;
    }

    /* 搜尋列與按鈕樣式 */
    .search-box {
      display: flex;
      justify-content: center;
      align-items: center;
      max-width: 400px;
      margin: 0 auto;
    }

    .search-box input {
      width: 100%;
      height: 38px;
      padding: 0 15px;
      border: 1px solid #ddd;
      border-radius: 20px 0 0 20px;
      outline: none;
      box-sizing: border-box;
      font-size: 14px;
    }

    .search-box button {
      height: 38px;
      padding: 0 18px;
      border: none;
      background-color: #8c7361;
      color: white;
      border-radius: 0 19px 19px 0;
      cursor: pointer;
      white-space: nowrap;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .search-box button:hover {
      background-color: #735d4d;
    }

    /* ==========================================
       相片區與文青 Slogan 區塊版面 (Hero Section)
       ========================================== */
    .hero-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
      gap: 30px;
      box-sizing: border-box;
    }

    /* 1. 相片滑動區 */
    .photo-slider-container {
      flex: 1.2;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(140, 115, 97, 0.15);
      background-color: #f2efe9;
    }

    .photo-track {
      display: flex;
      gap: 15px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      padding: 15px;
      -webkit-overflow-scrolling: touch;
    }

    .photo-track::-webkit-scrollbar {
      display: none;
    }
    .photo-track {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .photo-card {
      flex: 0 0 100%;
      height: 280px;
      scroll-snap-align: center;
      background-color: #e6dfd5;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #8c7361;
      font-size: 15px;
      border: 2px dashed #b5a493;
    }

    /* 2. 右側文青漸入式文字樣式 */
    .fade-text-container {
      flex: 0.8;
      text-align: left;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.3s;
    }

    .fade-text-container h2 {
      /* 套用文青書法字體，並加大字級與字距 */
      font-family: 'Ma Shan Zheng', cursive, sans-serif;
      font-size: 38px;

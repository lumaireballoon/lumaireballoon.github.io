<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LumaireBalloon 嶼光製氣</title>
  
  <style>
    /* 頁面基礎設定 */
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, "Helvetica Neue", sans-serif;
      background-color: #faf7f2;
    }

    /* 頂部 Header 區域 */
    .header-container {
      position: relative;
      background-color: #f2efe9;
      padding: 20px;
      text-align: center;
    }

    /* 漢堡按鈕圖示（固定在 Header 左上角） */
    .hamburger-menu {
      position: absolute;
      top: 25px;
      left: 25px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 26px;
      height: 18px;
      cursor: pointer;
      z-index: 1000;
    }

    .hamburger-menu .bar {
      height: 2px;
      width: 100%;
      background-color: #8c7361;
      border-radius: 2px;
      transition: all 0.3s ease;
    }

    /* 側邊抽屜選單 */
    .sidebar {
      position: fixed;
      top: 0;
      left: -260px;
      width: 250px;
      height: 100%;
      background-color: #faf7f2;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
      transition: left 0.3s ease;
      z-index: 1001;
      padding-top: 60px;
    }

    .sidebar.active {
      left: 0;
    }

    /* 關閉按鈕 (X) */
    .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 28px;
      color: #8c7361;
      cursor: pointer;
    }

    /* 選單連結樣式 */
    .sidebar ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .sidebar ul li {
      padding: 15px 30px;
    }

    .sidebar ul li a {
      text-decoration: none;
      color: #5c4d42;
      font-size: 16px;
      display: block;
      transition: color 0.2s;
    }

    .sidebar ul li a:hover {
      color: #a88b74;
    }

    /* 背景半透明遮罩 */
    .overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.3);
      z-index: 999;
    }

    .overlay.active {
      display: block;
    }

    /* 標題區域 */
    .title-area h1 {
      margin: 0;
      font-size: 24px;
      color: #8c7361;
      font-weight: normal;
    }

    .title-area p {
      margin: 5px 0 15px 0;
      font-size: 12px;
      color: #a88b74;
      letter-spacing: 2px;
    }

    /* 搜尋列與按鈕樣式修正 */
    .search-box {
      display: flex;
      justify-content: center;
      align-items: center;
      max-width: 400px;
      margin: 0 auto;
    }

    .search-box input {
      width: 100%;
      height: 38px;          /* 固定輸入框高度 */
      padding: 0 15px;
      border: 1px solid #ddd;
      border-radius: 20px 0 0 20px;
      outline: none;
      box-sizing: border-box;
      font-size: 14px;
    }

    .search-box button {
      height: 38px;          /* 與輸入框維持一致高度，防止爆開 */
      padding: 0 18px;       /* 按鈕左右舒適寬度 */
      border: none;
      background-color: #8c7361;
      color: white;
      border-radius: 0 19px 19px 0; /* 保持原有的右側圓角造型 */
      cursor: pointer;
      white-space: nowrap;   /* 強制「搜尋」文字橫排不換行 */
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .search-box button:hover {
      background-color: #735d4d;
    }
  </style>
</head>
<body>

  <!-- 頂部區塊 -->
  <header class="header-container">
    <!-- 左上角漢堡按鈕 -->
    <div class="hamburger-menu" onclick="toggleMenu()">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>

    <!-- 標題與搜尋列 -->
    <div class="title-area">
      <h1>LumaireBalloon</h1>
      <p>嶼光制氣</p>
    </div>
    <div class="search-box">
      <input type="text" placeholder="🔍 產品名稱">
      <button>搜尋</button>
    </div>
  </header>

  <!-- 側邊選單 -->
  <nav class="sidebar" id="sidebar">
    <div class="close-btn" onclick="toggleMenu()">&times;</div>
    <ul>
      <li><a href="#">首頁</a></li>
      <li><a href="#">關於我們</a></li>
      <li><a href="#">商品列表</a></li>
      <li><a href="#">最新消息</a></li>
      <li><a href="#">聯絡我們</a></li>
    </ul>
  </nav>

  <!-- 背景遮罩 -->
  <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

  <!-- JavaScript 控制邏輯 -->
  <script>
    function toggleMenu() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('overlay');
      
      sidebar.classList.toggle('active');
      overlay.classList.toggle('active');
    }
  </script>

</body>
</html>

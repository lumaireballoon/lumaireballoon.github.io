<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>氣球柱、拱門、球牆 | LumaireBalloon 嶼光製氣</title>
    <style>
        body {
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif; 
            background-color: #faf7f2; 
        }
        .header-container {
            position: relative; 
            background-color: #f2efe9; 
            padding: 20px; 
            text-align: center; 
        }
        .hamburger-menu {
            position: absolute; 
            top: 25px; 
            left: 25px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            width: 26px; 
            height: 18px; 
            cursor: pointer; 
            z-index: 1000; 
        }
        .hamburger-menu .bar {
            height: 2px; 
            width: 100%; 
            background-color: #8c7361; 
            border-radius: 2px; 
            transition: all 0.3s ease; 
        }
        .sidebar {
            position: fixed; 
            top: 0; 
            left: -260px; 
            width: 250px; 
            height: 100%; 
            background-color: #faf7f2; 
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1); 
            transition: left 0.3s ease; 
            z-index: 1001; 
            padding-top: 60px; 
            overflow-y: auto; 
        }
        .sidebar.active {
            left: 0; 
        }
        .close-btn {
            position: absolute; 
            top: 15px; 
            right: 20px; 
            font-size: 28px; 
            color: #8c7361; 
            cursor: pointer; 
        }
        .sidebar ul {
            list-style: none; 
            padding: 0; 
            margin: 0; 
        }
        .sidebar ul li {
            border-bottom: 1px solid rgba(140, 115, 97, 0.1); 
        }
        .sidebar ul li a, .sidebar .dropdown-btn {
            text-decoration: none; 
            color: #5c4d42; 
            font-size: 16px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 15px 25px; 
            width: 100%; 
            box-sizing: border-box; 
            background: none; 
            border: none; 
            cursor: pointer; 
            text-align: left; 
            font-family: inherit; 
            transition: color 0.2s, background-color 0.2s; 
        }
        .sidebar ul li a:hover, .sidebar .dropdown-btn:hover {
            color: #a88b74; 
            background-color: rgba(140, 115, 97, 0.05); 
        }
        .dropdown-container {
            display: none; 
            background-color: rgba(140, 115, 97, 0.04); 
            padding-left: 15px; 
        }
        .dropdown-container.active {
            display: block; 
        }
        .dropdown-container li {
            border-bottom: none; 
        }
        .dropdown-container a {
            font-size: 14px; 
            padding: 12px 25px; 
            color: #735d4d; 
        }
        .arrow {
            transition: transform 0.3s ease; 
            font-size: 12px; 
        }
        .dropdown-btn.active .arrow {
            transform: rotate(180deg); 
        }
        .overlay {
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0, 0, 0, 0.3); 
            z-index: 999; 
        }
        .overlay.active {
            display: block; 
        }
        .title-area h1 {
            margin: 0; 
            font-size: 24px; 
            color: #8c7361; 
            font-weight: normal; 
        }
        .title-area p {
            margin: 5px 0 15px 0; 
            font-size: 12px; 
            color: #a88b74; 
            letter-spacing: 2px; 
        }

        /* 商品頁面內容樣式 */
        .page-container {
            max-width: 900px; 
            margin: 30px auto; 
            padding: 0 20px; 
            box-sizing: border-box; 
        }
        .page-title {
            text-align: center; 
            color: #5c4d42; 
            font-size: 24px; 
            margin-bottom: 20px; 
            border-bottom: 2px solid #e6dfd5; 
            padding-bottom: 10px; 
        }
        .product-grid {
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); 
            gap: 20px; 
            margin-top: 20px; 
        }
        .product-card {
            background: #fff; 
            border-radius: 12px; 
            padding: 15px; 
            box-shadow: 0 4px 10px rgba(140, 115, 97, 0.1); 
            text-align: center; 
        }
        .product-img {
            width: 100%; 
            height: 200px; 
            background-color: #e6dfd5; 
            border-radius: 8px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: #8c7361; 
            margin-bottom: 12px; 
        }
        .product-name {
            font-size: 18px; 
            color: #5c4d42; 
            margin: 8px 0; 
        }
        .product-desc {
            font-size: 13px; 
            color: #8c7361; 
            line-height: 1.5; 
            margin-bottom: 12px; 
        }

        /* 頁面主要 LINE 諮詢按鈕 */
        .line-btn-container {
            text-align: center; 
            margin-top: 40px; 
        }
        .line-btn {
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            background-color: #06C755; 
            color: white; 
            text-decoration: none; 
            font-size: 15px; 
            font-weight: bold; 
            padding: 12px 28px; 
            border-radius: 30px; 
            box-shadow: 0 4px 12px rgba(6, 199, 85, 0.35); 
            transition: all 0.2s ease; 
        }
        .line-btn:hover {
            background-color: #05b34c; 
            transform: translateY(-2px); 
            box-shadow: 0 6px 16px rgba(6, 199, 85, 0.45); 
        }

        /* 右下角浮動 LINE 小幫手按鈕 */
        .floating-line-btn {
            position: fixed; 
            bottom: 25px; 
            right: 25px; 
            background-color: #06C755; 
            color: white; 
            width: 60px; 
            height: 60px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25); 
            z-index: 9999; 
            transition: all 0.3s ease; 
            text-decoration: none; 
        }
        .floating-line-btn:hover {
            background-color: #05b34c; 
            transform: scale(1.08); 
            box-shadow: 0 6px 20px rgba(6, 199, 85, 0.4); 
        }

        .line-icon-svg {
            width: 24px; 
            height: 24px; 
            fill: white; 
        }
        .floating-line-btn .line-icon-svg {
            width: 32px; 
            height: 32px; 
        }

        @media (max-width: 768px) {
            .floating-line-btn {
                bottom: 20px; 
                right: 20px; 
                width: 54px; 
                height: 54px; 
            }
            .floating-line-btn .line-icon-svg {
                width: 28px; 
                height: 28px; 
            }
        }
    </style>
</head>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LumaireBalloon 嶼光製氣 | 首頁</title>
    <style>
        body {margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif; background-color: #faf7f2; }
        
        /* =========================================
           1. 頂部大背景區塊 (完美等比滿版版)
           ========================================= */
        .hero-header {
            position: relative; 
            width: 100%;
            /* 使用 aspect-ratio 讓區塊高度隨圖片比例自動縮放，確保各裝置都不會變形或裁切 */
            aspect-ratio: 16 / 9; /* 若您的原圖比較寬，可改成 21/9 或 2/1 */
            min-height: 200px; /* 保底高度，避免手機版縮太小 */
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden; 
            /* 建議：您可以把這裡的背景色改成圖片本身的灰藍色 (例如 #7f8291)，融合度會更高 */
            background-color: #faf7f2; 
        }

        .hero-header::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('公司背景Logo.jpg'); 
            
            /* 關鍵修正：確保寬度永遠 100% 滿版，高度照比例縮放，絕對不裁切 */
            background-size: 100% auto; 
            
            /* 往下調整：第一個是左右(center)，第二個是上下，可改成 10% 或 20% 來微調位置 */
            background-position: center 15%; 
            
            background-repeat: no-repeat;
            opacity: 0.5; 
            z-index: 1; 
        }

        /* 導覽列與漢堡選單 (維持原樣) */
        .top-nav { position: fixed; top: 0; left: 0; width: 100%; padding: 20px 25px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: flex-start; z-index: 9999; }
        .hamburger-menu { display: flex; flex-direction: column; justify-content: space-between; width: 26px; height: 18px; cursor: pointer; }
        .hamburger-menu .bar { height: 2px; width: 100%; background-color: #fff; border-radius: 2px; box-shadow: 0 0 4px rgba(0, 0, 0, 0.8), 0 0 8px rgba(0, 0, 0, 0.5); transition: all 0.3s ease; }
        
        /* 搜尋框 (維持原樣) */
        .search-box { display: flex; max-width: 250px; }
        .search-box input { width: 100%; height: 36px; padding: 0 15px; border: none; border-radius: 18px 0 0 18px; outline: none; font-size: 14px; background: rgba(255, 255, 255, 0.85); }
        .search-box button { height: 36px; padding: 0 15px; border: none; background-color: #8c7361; color: white; border-radius: 0 18px 18px 0; cursor: pointer; font-size: 14px; }

        /* 置中疊加的小 LOGO */
        .brand-logo { position: relative; width: 420px; max-width: 85%; height: auto; z-index: 10; filter: drop-shadow(0px 2px 5px rgba(0,0,0,0.3)); margin-top: 50px; }

        /* =========================================
           2. 側邊欄與其他共用樣式 (維持原樣)
           ========================================= */
        .sidebar {position: fixed; top: 0; left: -260px; width: 250px; height: 100%; background-color: #faf7f2; box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1); transition: left 0.3s ease; z-index: 1001; padding-top: 60px; overflow-y: auto; }
        .sidebar.active {left: 0; }
        .close-btn {position: absolute; top: 15px; right: 20px; font-size: 28px; color: #8c7361; cursor: pointer; }
        .sidebar ul {list-style: none; padding: 0; margin: 0; }
        .sidebar ul li {border-bottom: 1px solid rgba(140, 115, 97, 0.1); }
        .sidebar ul li a, .sidebar .dropdown-btn {text-decoration: none; color: #5c4d42; font-size: 16px; display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; width: 100%; box-sizing: border-box; background: none; border: none; cursor: pointer; text-align: left; font-family: inherit; transition: color 0.2s, background-color 0.2s; }
        .sidebar ul li a:hover, .sidebar .dropdown-btn:hover {color: #a88b74; background-color: rgba(140, 115, 97, 0.05); }
        .dropdown-container {display: none; background-color: rgba(140, 115, 97, 0.04); padding-left: 15px; }
        .dropdown-container.active {display: block; }
        .dropdown-container li {border-bottom: none; }
        .dropdown-container a {font-size: 14px; padding: 12px 25px; color: #735d4d; }
        .arrow {transition: transform 0.3s ease; font-size: 12px; }
        .dropdown-btn.active .arrow {transform: rotate(180deg); }
        .overlay {display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.3); z-index: 999; }
        .overlay.active {display: block; }
        
        .hero-section {display: flex; flex-direction: column; align-items: center; max-width: 800px; margin: 30px auto; padding: 0 20px; gap: 25px; box-sizing: border-box; }
        .photo-slider-container {width: 100%; position: relative; overflow: hidden; border-radius: 12px; box-shadow: 0 4px 15px rgba(140, 115, 97, 0.15); background-color: #f2efe9; }
        .photo-track {display: flex; gap: 15px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; padding: 15px; -webkit-overflow-scrolling: touch; }
        .photo-track::-webkit-scrollbar {display: none; }
        .photo-card {flex: 0 0 100%; height: 320px; scroll-snap-align: center; background-color: #e6dfd5; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #8c7361; font-size: 15px; border: 2px dashed #b5a493; }
        .fade-text-container {width: 100%; text-align: center; opacity: 0; transform: translateY(20px); animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; animation-delay: 0.3s; }
        .fade-text-container h2 {font-size: 26px; color: #5c4d42; margin: 0 0 10px 0; letter-spacing: 3px; font-weight: bold; }
        .fade-text-container p {font-size: 14px; color: #8c7361; margin: 0 0 20px 0; letter-spacing: 1.5px; line-height: 1.8; }
        
        .line-btn {display: inline-flex; align-items: center; justify-content: center; gap: 12px; background-color: #06C755; color: white; text-decoration: none; font-size: 18px; font-weight: bold; padding: 14px 32px; border-radius: 30px; box-shadow: 0 4px 10px rgba(6, 199, 85, 0.3); transition: all 0.2s ease; letter-spacing: 1px; }
        .line-btn:hover {background-color: #05b34c; transform: translateY(-2px); box-shadow: 0 6px 14px rgba(6, 199, 85, 0.4); }
        
        @keyframes fadeInUp {0% {opacity: 0; transform: translateY(20px); } 100% {opacity: 1; transform: translateY(0); } }

        .services-section {max-width: 1000px; margin: 50px auto; padding: 0 20px; text-align: center; }
        .services-title {color: #5c4d42; font-size: 24px; margin-bottom: 30px; letter-spacing: 2px; }
        .services-grid {display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .service-card-item {background-color: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(140, 115, 97, 0.08); border: 1px solid #f2efe9; transition: transform 0.3s ease; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .service-card-item:hover {transform: translateY(-5px); box-shadow: 0 8px 25px rgba(140, 115, 97, 0.15); }
        .service-img-placeholder {width: 100%; height: 160px; background-color: #e6dfd5; border-radius: 8px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; color: #8c7361; font-size: 14px; border: 2px dashed #b5a493; }
        .service-card-item h3 {color: #8c7361; margin: 0 0 10px 0; font-size: 18px; }
        .service-card-item p {color: #a88b74; font-size: 14px; margin: 0; }
        
        .floating-line-btn {position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; background-color: #06C755; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(6, 199, 85, 0.4); z-index: 9999; transition: transform 0.3s ease; text-decoration: none; }
        .floating-line-btn:hover {transform: scale(1.1); }

        /* ===================================================
           3. 響應式微調 (已移除強制高度，避免破壞比例)
           =================================================== */

        /* 平板/電腦 */
        @media (max-width: 1180px) {
            .brand-logo { width: 400px; margin-top: 40px; }
            .services-grid { grid-template-columns: repeat(3, 1fr); gap: 15px; }
        }

        /* 手機 (直立) */
        @media (max-width: 768px) {
            .brand-logo { width: 240px; margin-top: 60px; }
            .top-nav { padding: 12px 15px; }
            .search-box { max-width: 160px; }
            .search-box input { height: 32px; font-size: 12px; }
            .search-box button { height: 32px; font-size: 12px; padding: 0 10px; }
            .services-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .service-card-item { padding: 12px; }
            .service-img-placeholder { height: 110px; margin-bottom: 10px; }
            .service-card-item h3 { font-size: 16px; margin-bottom: 5px; }
            .service-card-item p { font-size: 12px; }
            .fade-text-container h2 { font-size: 20px; }
            .fade-text-container p { font-size: 13px; }
        }
    </style>
</head>

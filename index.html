<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首頁 | LumaireBalloon 嶼光製氣</title>
    <style>
        /* 共用基礎樣式 */
        body {
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif; 
            background-color: #faf7f2; 
        }
        
        /* 頂部導覽列 */
        .header-container {
            position: relative; 
            background-color: #f2efe9; 
            padding: 20px; 
            text-align: center; 
        }
        .hamburger-menu {
            position: absolute; 
            top: 25px; 
            left: 25px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            width: 26px; 
            height: 18px; 
            cursor: pointer; 
            z-index: 1000; 
        }
        .hamburger-menu .bar {
            height: 2px; 
            width: 100%; 
            background-color: #8c7361; 
            border-radius: 2px; 
            transition: all 0.3s ease; 
        }
        .title-area h1 {
            margin: 0; 
            font-size: 24px; 
            color: #8c7361; 
            font-weight: normal; 
        }
        .title-area p {
            margin: 5px 0 15px 0; 
            font-size: 12px; 
            color: #a88b74; 
            letter-spacing: 2px; 
        }

        /* 側邊欄選單 (與各頁面共用) */
        .sidebar {
            position: fixed; 
            top: 0; 
            left: -260px; 
            width: 250px; 
            height: 100%; 
            background-color: #faf7f2; 
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1); 
            transition: left 0.3s ease; 
            z-index: 1001; 
            padding-top: 60px; 
            overflow-y: auto; 
        }
        .sidebar.active {
            left: 0; 
        }
        .close-btn {
            position: absolute; 
            top: 15px; 
            right: 20px; 
            font-size: 28px; 
            color: #8c7361; 
            cursor: pointer; 
        }
        .sidebar ul {
            list-style: none; 
            padding: 0; 
            margin: 0; 
        }
        .sidebar ul li {
            border-bottom: 1px solid rgba(140, 115, 97, 0.1); 
        }
        .sidebar ul li a, .sidebar .dropdown-btn {
            text-decoration: none; 
            color: #5c4d42; 
            font-size: 16px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 15px 25px; 
            width: 100%; 
            box-sizing: border-box; 
            background: none; 
            border: none; 
            cursor: pointer; 
            text-align: left; 
            font-family: inherit; 
            transition: color 0.2s, background-color 0.2s; 
        }
        .sidebar ul li a:hover, .sidebar .dropdown-btn:hover {
            color: #a88b74; 
            background-color: rgba(140, 115, 97, 0.05); 
        }
        .dropdown-container {
            display: none; 
            background-color: rgba(140, 115, 97, 0.04); 
            padding-left: 15px; 
        }
        .dropdown-container.active {
            display: block; 
        }
        .dropdown-container li {
            border-bottom: none; 
        }
        .dropdown-container a {
            font-size: 14px; 
            padding: 12px 25px; 
            color: #735d4d; 
        }
        .arrow {
            transition: transform 0.3s ease; 
            font-size: 12px; 
        }
        .dropdown-btn.active .arrow {
            transform: rotate(180deg); 
        }
        .overlay {
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0, 0, 0, 0.3); 
            z-index: 999; 
        }
        .overlay.active {
            display: block; 
        }

        /* ---------------- 首頁專屬排版設計 ---------------- */
        
        /* 1. 主視覺 Banner */
        .hero-banner {
            width: 100%;
            height: 350px; /* 您可依需求調整 Banner 高度 */
            background-color: #e6dfd5; 
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8c7361;
            font-size: 20px;
            letter-spacing: 2px;
            /* 未來如果要放圖片，可以加上 background-image: url('圖片網址'); background-size: cover; background-position: center; */
        }

        /* 2. 品牌介紹與 Slogan */
        .brand-intro {
            text-align: center;
            padding: 50px 20px;
            background-color: #faf7f2;
        }
        .brand-intro h2 {
            color: #5c4d42;
            font-size: 22px;
            margin-bottom: 15px;
            font-weight: normal;
        }
        .brand-intro p {
            color: #8c7361;
            font-size: 15px;
            line-height: 1.8;
            max-width: 600px;
            margin: 0 auto;
        }

        /* 3. 服務項目 / 商品分類導覽 */
        .category-section {
            max-width: 900px;
            margin: 0 auto 60px auto;
            padding: 0 20px;
        }
        .category-title {
            text-align: center;
            color: #5c4d42;
            font-size: 20px;
            margin-bottom: 30px;
        }
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .category-card {
            background-color: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(140, 115, 97, 0.08);
            text-decoration: none; /* 讓整個卡片都可以點擊且沒有底線 */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(140, 115, 97, 0.15);
        }
        .category-img {
            width: 100%;
            height: 180px;
            background-color: #f2efe9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a88b74;
            font-size: 14px;
        }
        .category-info {
            padding: 20px;
            text-align: center;
        }
        .category-info h3 {
            margin: 0 0 10px 0;
            color: #5c4d42;
            font-size: 18px;
        }
        .category-info p {
            margin: 0;
            color: #8c7361;
            font-size: 13px;
        }

        /* 右下角常駐浮動小幫手 (與各頁面共用) */
        .floating-line-btn {
            position: fixed; 
            bottom: 25px; 
            right: 25px; 
            background-color: #06C755; 
            width: 60px; 
            height: 60px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            box-shadow: 0 4px 15px rgba(6, 199, 85, 0.4); 
            z-index: 9999; 
            transition: all 0.3s ease; 
            text-decoration: none; 
        }
        .floating-line-btn:hover {
            background-color: #05b34c; 
            transform: scale(1.08); 
            box-shadow: 0 6px 20px rgba(6, 199, 85, 0.6); 
        }
        .line-logo-img {
            height: 32px; /* 已為您調整放大圖示 */
            width: auto;
            display: block;
        }

        @media (max-width: 768px) {
            .hero-banner { height: 250px; }
            .floating-line-btn {
                bottom: 20px; 
                right: 20px; 
                width: 52px; 
                height: 52px; 
            }
            .line-logo-img {
                height: 28px;
            }
        }
    </style>
</head>

            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
        <div class="title-area">
            <h1>LumaireBalloon</h1>
            <p>嶼光製
